steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/team-collaboration-tool:$COMMIT_SHA', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/team-collaboration-tool:$COMMIT_SHA']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'team-collaboration-tool'
      - '--image'
      - 'gcr.io/$PROJECT_ID/team-collaboration-tool:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated' # Adjust based on auth requirements

images:
  - 'gcr.io/$PROJECT_ID/team-collaboration-tool:$COMMIT_SHA'
