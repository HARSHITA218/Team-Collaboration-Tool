steps:
  # Step 1: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/team-collaboration-tool:$COMMIT_SHA'
      - '.'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/team-collaboration-tool:$COMMIT_SHA'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'team-collaboration-tool'
      - '--image'
      - 'gcr.io/$PROJECT_ID/team-collaboration-tool:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--set-env-vars'
      - 'NEXT_PUBLIC_SUPABASE_URL=https://nfhqbuttokugefmardjx.supabase.co,NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_4zdmV-ZBt90RuJ3rY0dlZw_nXafZxve,AUTH_SECRET=h4ck4th0n-teamcollab-secret-2026'

images:
  - 'gcr.io/$PROJECT_ID/team-collaboration-tool:$COMMIT_SHA'

